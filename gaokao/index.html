<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>高考物理 · IlluPhy 物理题库</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2333;--muted:#5b6474;--line:#e5e8f0;--pri:#2b5fd9;--pri2:#eaf0ff;--ok:#0e9f6e;--warn:#b45309}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;font-size:15px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px 64px}
header.top{background:linear-gradient(135deg,#1e3a8a,#2b5fd9);color:#fff;padding:28px 0 22px;margin-bottom:28px}
header.top .wrap{padding-bottom:0}
.crumb{font-size:13px;opacity:.85;margin-bottom:6px}
.crumb a{color:#fff;text-decoration:none;opacity:.9}
.crumb a:hover{text-decoration:underline}
h1{font-size:26px;font-weight:700;letter-spacing:.5px}
.sub{font-size:14px;opacity:.85;margin-top:4px}
h2{font-size:20px;margin:34px 0 14px;padding-left:12px;border-left:4px solid var(--pri)}
h3{font-size:16.5px;margin:0 0 10px;color:var(--pri)}
.callout{background:var(--pri2);border:1px solid #c9d8ff;border-radius:10px;padding:14px 18px;margin:14px 0;font-size:14px}
.callout b{color:var(--pri)}
.callout.warn{background:#fff7ed;border-color:#fed7aa}.callout.warn b{color:var(--warn)}
.note{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;padding:12px 16px;margin:12px 0;font-size:14px;color:#065f46}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin:14px 0;box-shadow:0 1px 3px rgba(20,30,60,.05)}
.sec h3 .no{display:inline-block;background:var(--pri);color:#fff;font-size:12.5px;border-radius:6px;padding:1px 8px;margin-right:8px;vertical-align:2px}
ul.pts{list-style:none;margin-top:2px}
ul.pts li{padding:3px 0 3px 20px;position:relative;color:#333c50}
ul.pts li::before{content:"";position:absolute;left:4px;top:13px;width:6px;height:6px;border-radius:50%;background:#93b4f5}
@media(min-width:720px){ul.pts{columns:2;column-gap:36px}ul.pts li{break-inside:avoid}}
.grid{display:grid;gap:14px;margin-top:6px}
.grid.c3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.chcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;text-decoration:none;color:var(--ink);transition:box-shadow .15s,border-color .15s}
.chcard:hover{border-color:var(--pri);box-shadow:0 4px 14px rgba(43,95,217,.12)}
.chcard .no{font-size:12.5px;color:var(--pri);font-weight:600}
.chcard .nm{font-size:16.5px;font-weight:700;margin:2px 0 6px}
.chcard .meta{font-size:12.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;font-size:14px;margin:10px 0}
th,td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
th{background:#f0f3fa;color:#333;font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:none}
code{background:#f0f3fa;border-radius:5px;padding:1px 7px;font-size:13px;color:var(--pri);font-family:ui-monospace,Consolas,monospace}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px}
.pager a{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;text-decoration:none;color:var(--ink);font-size:14px}
.pager a:hover{border-color:var(--pri)}
.pager a small{display:block;color:var(--muted);font-size:12px}
.pager a.next{text-align:right}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:48px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="crumb"><a href="/exam/">首页</a> › 高考物理</div>
  <h1>高考物理</h1>
  <div class="sub">18 章考点体系</div>
</div></header>
<div class="wrap">
<div class="card" style="text-align:center;padding:48px 24px">
  <div style="font-size:14px;color:var(--muted);margin-bottom:8px">高考物理 · IlluPhy</div>
  <a href="/exam/gaokao/bank/" style="display:inline-block;background:var(--pri);color:#fff;text-decoration:none;border-radius:10px;padding:18px 48px;font-size:17px;font-weight:700;letter-spacing:1px">进入考点题库 →</a>
  <div style="color:var(--muted);font-size:13px;margin-top:14px">18 章体系 · 纯大纲无内置题目</div>
</div>
<div class="callout warn" style="margin-top:14px;max-width:480px;margin-left:auto;margin-right:auto">
  <b>说明</b> · 解题训练功能已全部移除。题库当前只按考点大纲展示，真题将在后续逐题录入并标注。
</div>
<div class="foot">IlluPhy · 物理考点题库 · 纯静态 HTML</div>
</div>
</body>
</html>
