<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>IlluPhy · 物理题库</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2333;--muted:#5b6474;--line:#e5e8f0;--pri:#2b5fd9;--pri2:#eaf0ff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center}
main{max-width:820px;width:100%;padding:60px 40px 80px}
h1{font-size:34px;font-weight:700;text-align:center;margin-bottom:6px;letter-spacing:2px}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:48px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.btn{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:56px 36px;text-decoration:none;color:var(--ink);transition:transform .12s,box-shadow .15s,border-color .15s}
.btn:hover{border-color:var(--pri);box-shadow:0 8px 24px rgba(43,95,217,.12);transform:translateY(-2px)}
.btn .big{font-size:26px;font-weight:700;color:var(--pri);margin-bottom:8px}
.btn .desc{font-size:14px;color:var(--muted);line-height:1.7}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:48px}
</style>
</head>
<body>
<main>
  <h1>IlluPhy</h1>
  <div class="sub">物理考点题库 · 18 章体系</div>
  <div class="grid">
    <a class="btn" href="/exam/gaokao/bank/">
      <div class="big">高考物理</div>
      <div class="desc">18 章考点细分 · 综合题型总表 · 跨章节组合</div>
    </a>
    <a class="btn" href="/exam/zhongkao/bank/">
      <div class="big">中考物理</div>
      <div class="desc">18 章考点体系 · 天津真题校准 · 实验与综合</div>
    </a>
  </div>
  <div class="foot">纯静态页面 · 无 JavaScript · GitHub Pages 部署</div>
</main>
</body>
</html>
